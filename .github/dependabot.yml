version: 2
updates:
  # npm dependencies (the plugin's runtime + build/test toolchain).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the new native-compiler line — a deliberate major
      # migration that currently fails `tsc --noEmit`. Hold at 5.x majors
      # until we migrate on purpose; minor/patch TS bumps still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI and release workflows. Keeps the
  # SHA-pinned third-party action (softprops/action-gh-release,
  # gitleaks/gitleaks-action) and the first-party actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
