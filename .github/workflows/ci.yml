name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: every job only reads the repo unless it needs more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsconfig.json is strict:true — this fails on any type error, which
      # Parcel's build does NOT (it transpiles without type-checking).
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks enumerates PR commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      # Third-party action pinned by commit SHA (supply-chain integrity),
      # not a mutable tag. SHA is gitleaks-action v3.0.0. Free for public /
      # personal repos (no GITLEAKS_LICENSE needed). GITHUB_TOKEN is
      # required so the action can list the pull request's commits.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    # Enforcing gate: fails the build on any advisory in a shipped
    # dependency. Scoped to --omit=dev because dev-only tooling (parcel,
    # vitest) never reaches the published plugin. Transitive advisories in
    # @logseq/libs's pinned dompurify / lodash-es are held at patched,
    # same-major versions via the `overrides` block in package.json.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
